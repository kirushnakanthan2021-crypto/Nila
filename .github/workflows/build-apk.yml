name: Build Nila Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "styles.css"
      - "app.js"
      - "manifest.webmanifest"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Nila
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Prepare app files
        run: |
          mkdir -p www
          cp index.html styles.css app.js www/
          cp manifest.webmanifest www/ || true
          cat > package.json <<'EOF'
          {
            "name": "nila-android",
            "version": "1.0.0",
            "private": true,
            "description": "Nila personal AI Android wrapper",
            "scripts": {
              "build:android": "cap sync android"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.nila.personalai",
            "appName": "Nila",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

      - name: Install Capacitor
        run: npm install @capacitor/core@6 @capacitor/android@6 @capacitor/cli@6

      - name: Generate Android project
        run: npx cap add android

      - name: Build debug APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publish APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: Nila-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
